<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bar-Crawl Brawl</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #0d0a14; overflow: hidden; }
  /* Layout lives in a fixed wrapper, never on <body>. */
  #stage { position: fixed; inset: 0; background: #0d0a14; overflow: hidden; }
  /* Two stacked canvases: the 3D world underneath, menus and labels drawn in 2D on top. */
  #gl, #game { position: absolute; display: block; }
  #gl { visibility: hidden; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="game"></canvas></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
