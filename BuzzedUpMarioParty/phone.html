<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bar-Crawl Brawl controller</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #140f1f; overflow: hidden; }
  /* Layout lives in a fixed wrapper, never on <body>. */
  #pad {
    position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 44px 1fr;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #fff7e6;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #status {
    grid-column: 1 / 3; grid-row: 1; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; background: #231a36; border-bottom: 3px solid #3b2d5c;
  }
  #stickZone { grid-column: 1; grid-row: 2; position: relative; border-right: 2px dashed #3b2d5c; }
  #btnZone { grid-column: 2; grid-row: 2; position: relative; display: flex; align-items: center; justify-content: center; }
  .hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 13px; font-weight: 600; color: #a99cc2; pointer-events: none; }
  #base, #knob { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
  #base { width: 150px; height: 150px; border: 4px solid #4fd8ff; opacity: .5; left: 50%; top: 50%; }
  #knob { width: 70px; height: 70px; background: #4fd8ff; left: 50%; top: 50%; }
  #btn {
    width: min(60vmin, 80%); aspect-ratio: 1; border-radius: 50%; background: #ff4fa3; border: 6px solid #fff7e6;
    display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 900; pointer-events: none;
  }
  #btn.down { background: #ffc83d; transform: scale(.94); }
</style>
</head>
<body>
<div id="pad">
  <div id="status">Connecting…</div>
  <div id="stickZone"><div id="base"></div><div id="knob"></div><div class="hint">Drag anywhere here to move</div></div>
  <div id="btnZone"><div id="btn">A</div><div class="hint">Tap anywhere here</div></div>
</div>
<script>
const statusEl = document.getElementById('status');
const stickZone = document.getElementById('stickZone');
const btnZone = document.getElementById('btnZone');
const base = document.getElementById('base');
const knob = document.getElementById('knob');
const btn = document.getElementById('btn');
const RADIUS = 60;

const state = { x: 0, y: 0, b: false };
let ws = null;
let myId = Number(sessionStorage.getItem('bcb-phone-id')) || 0;
let dirty = false;
let who = '';

function send() {
  dirty = false;
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(state));
}

function showStatus(textValue, color) {
  statusEl.textContent = textValue;
  statusEl.style.color = color || '#fff7e6';
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/phone${myId ? '?id=' + myId : ''}`);
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === 'you') {
      myId = m.id;
      sessionStorage.setItem('bcb-phone-id', String(myId));
      showStatus(`Phone ${myId} connected${who ? ' · ' + who : ''}`);
    } else if (m.t === 'full') {
      showStatus('The game is full', '#ff6b5e');
    } else if (m.t === 'who') {
      who = m.name || '';
      showStatus(`Phone ${myId}${who ? ' · ' + who : ''}`, m.color);
      if (m.color) knob.style.background = m.color;
    } else if (m.t === 'buzz' && navigator.vibrate) {
      navigator.vibrate(m.ms || 80);
    }
  };
  ws.onclose = () => {
    showStatus('Disconnected. Reconnecting…', '#ff6b5e');
    setTimeout(connect, 1500);
  };
}

let stickPointer = null;
let origin = null;

function placeStick(cx, cy, kx, ky) {
  const r = stickZone.getBoundingClientRect();
  base.style.left = cx - r.left + 'px';
  base.style.top = cy - r.top + 'px';
  knob.style.left = kx - r.left + 'px';
  knob.style.top = ky - r.top + 'px';
}

stickZone.addEventListener('pointerdown', (e) => {
  if (stickPointer !== null) return;
  stickPointer = e.pointerId;
  origin = { x: e.clientX, y: e.clientY };
  stickZone.setPointerCapture(e.pointerId);
  placeStick(origin.x, origin.y, origin.x, origin.y);
});
stickZone.addEventListener('pointermove', (e) => {
  if (e.pointerId !== stickPointer) return;
  let dx = (e.clientX - origin.x) / RADIUS;
  let dy = (e.clientY - origin.y) / RADIUS;
  const m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }
  state.x = dx;
  state.y = dy;
  dirty = true;
  placeStick(origin.x, origin.y, origin.x + dx * RADIUS, origin.y + dy * RADIUS);
});
function releaseStick(e) {
  if (e.pointerId !== stickPointer) return;
  stickPointer = null;
  state.x = 0;
  state.y = 0;
  base.style.left = knob.style.left = '50%';
  base.style.top = knob.style.top = '50%';
  send();
}
stickZone.addEventListener('pointerup', releaseStick);
stickZone.addEventListener('pointercancel', releaseStick);

const btnPointers = new Set();
function setButton() {
  const down = btnPointers.size > 0;
  if (down === state.b) return;
  state.b = down;
  btn.classList.toggle('down', down);
  if (down && navigator.vibrate) navigator.vibrate(15);
  send();
}
btnZone.addEventListener('pointerdown', (e) => { btnPointers.add(e.pointerId); btnZone.setPointerCapture(e.pointerId); setButton(); });
for (const type of ['pointerup', 'pointercancel']) {
  btnZone.addEventListener(type, (e) => { btnPointers.delete(e.pointerId); setButton(); });
}

document.addEventListener('contextmenu', (e) => e.preventDefault());
// Stick movement goes out at about 30 updates a second; button presses go immediately.
setInterval(() => { if (dirty) send(); }, 33);
connect();
</script>
</body>
</html>
